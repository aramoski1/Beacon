name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # Live security tests need a dedicated Supabase project — skip in default CI.
      # Live GIS describes (MassGIS / BCPA / PBCPA) skip when CI=true (set by Actions).
      - run: npm test -- --exclude tests/security/**
        env:
          JEV_API_KEY: ${{ secrets.JEV_API_KEY }}
