name: CI

on:
  pull_request:
  push:
    branches: [main, "feature/**"]

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # Live security tests need a dedicated Supabase project — skip in default CI.
      - run: npm test -- --exclude tests/security/**
